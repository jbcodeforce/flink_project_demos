[project]
name = "dashboard-data"
version = "0.1.0"
description = "Parquet export and DuckDB query helpers for C360 Flink view data"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
]

[project.scripts]
export-views-to-parquet = "dashboard_data.export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard_data"]
